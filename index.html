<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sistema de Videollamada WebRTC - E.E.T. Nº 3139</title>
  
  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Hoja de estilos externa -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- Barra superior institucional -->
  <header class="app-header">
    <div class="brand-container">
      <div class="school-badge" title="E.E.T. Nº 3139">
        <!-- Ícono institucional: Escudo / Red -->
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
          <path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>E.E.T. Nº 3139 “Gral. Martín M. de Güemes”</h1>
        <span>Comunicación WebRTC Peer-to-Peer</span>
      </div>
    </div>

    <!-- Indicador de conexión en tiempo real -->
    <div class="connection-badge">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Inicializando...</span>
    </div>
  </header>

  <!-- Espacio principal de videoconferencia -->
  <main class="workspace">
    <!-- Contenedor principal requerido por la consigna del TP -->
    <div id="video-chat-container" class="video-position">
      
      <!-- Cartel de guía paso a paso y botón para compartir enlace -->
      <div id="helper-banner" class="helper-banner">
        <span id="helper-text" class="helper-text">Paso 1: Comparte este enlace con tu compañera</span>
        <button id="btn-copy-link" class="btn-copy-link" onclick="copyMeetingLink()" title="Copiar enlace para tu compañera">
          <svg class="icon-svg" style="width: 13px; height: 13px;" viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span id="btn-copy-label">Copiar enlace</span>
        </button>
      </div>

      <!-- Estado de espera para el video remoto -->
      <div id="remote-placeholder" class="remote-placeholder">
        <div class="avatar-icon">
          <svg class="icon-svg" style="width: 36px; height: 36px;" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <p id="placeholder-text">Esperando que tu compañera abra el enlace...</p>
      </div>

      <!-- Video remoto principal con autoplay -->
      <video id="remote-video" autoplay="autoplay" playsinline></video>

      <!-- Video local (miniatura Picture-in-Picture) con autoplay y muted -->
      <div class="local-video-wrapper">
        <video id="local-video" autoplay="autoplay" muted playsinline></video>
        <span class="local-video-label">Cámara local</span>
      </div>

      <!-- Barra flotante de controles con íconos vectoriales -->
      <div class="controls-bar">
        <!-- Botón Silenciar Micrófono -->
        <button id="btn-audio" class="btn-control icon-only" onclick="toggleAudio()" title="Silenciar / Activar micrófono">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

        <!-- Botón Apagar / Encender Cámara -->
        <button id="btn-video" class="btn-control icon-only" onclick="toggleVideo()" title="Activar / Desactivar cámara">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </button>

        <!-- Botón Iniciar Llamada -->
        <button id="btn-start-call" class="btn-control btn-start" onclick="start()" title="Establecer conexión con el par">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <span id="btn-start-label">Llamar</span>
        </button>

        <!-- Botón Colgar / Desconectar -->
        <button class="btn-control btn-hangup" onclick="hangUp()" title="Finalizar llamada en curso">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <span id="btn-hangup-label">Colgar</span>
        </button>

        <!-- Botón Pantalla Completa -->
        <button class="btn-control icon-only" onclick="toggleFullScreen()" title="Pantalla completa">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>

    </div>
  </main>

  <!-- Lógica WebRTC externa -->
  <script src="js/main.js"></script>
</body>
</html>
